name: Build ProPlayer Studio

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test pipeline (ffmpeg + stand-in AI engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -timeout 20m

  build:
    name: Build Windows EXE
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build ProPlayerStudio.exe
        shell: pwsh
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -trimpath -ldflags "-H windowsgui -s -w" -o dist/ProPlayerStudio.exe .
          if (-not (Test-Path dist/ProPlayerStudio.exe)) { throw "build failed" }

      - name: Smoke test (the EXE starts and answers)
        shell: pwsh
        run: |
          $pf = Join-Path $env:RUNNER_TEMP "port.txt"
          if (Test-Path $pf) { Remove-Item $pf }
          $p = Start-Process -FilePath ".\dist\ProPlayerStudio.exe" -ArgumentList "--serve", "`"$pf`"" -PassThru
          for ($i = 0; $i -lt 30 -and -not (Test-Path $pf); $i++) { Start-Sleep -Seconds 1 }
          if (-not (Test-Path $pf)) { throw "ProPlayerStudio.exe did not start" }
          $url = (Get-Content $pf -Raw).Trim()
          $s = Invoke-RestMethod -Method Post -Uri ($url + "api/ping")
          if ($s.state -ne "idle") { throw "unexpected state: $($s.state)" }
          $page = Invoke-WebRequest -UseBasicParsing -Uri $url
          if ($page.Content -notmatch "ProPlayer Studio") { throw "UI page is wrong" }
          try { Invoke-RestMethod -Method Post -Uri ($url + "api/quit") | Out-Null } catch {}
          Start-Sleep -Seconds 1
          Write-Host "Smoke test passed: $url"

      - name: Build installer (ProPlayerStudio-Setup.exe)
        shell: pwsh
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          Copy-Item dist/ProPlayerStudio.exe installer/ProPlayerStudio.exe
          Push-Location installer
          go build -trimpath -ldflags "-H windowsgui -s -w" -o ../dist/ProPlayerStudio-Setup.exe .
          Pop-Location
          if (-not (Test-Path dist/ProPlayerStudio-Setup.exe)) { throw "installer build failed" }
          Get-ChildItem dist | Format-Table Name, Length

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ProPlayerStudio
          path: |
            dist/ProPlayerStudio.exe
            dist/ProPlayerStudio-Setup.exe
          if-no-files-found: error

      - name: Publish release (only for tags like v1.0.0)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ProPlayerStudio.exe
            dist/ProPlayerStudio-Setup.exe
